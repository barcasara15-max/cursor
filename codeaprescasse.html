<!DOCTYPE html>
<html>
<head>
<style>
.card {
  width: 300px;
  margin: auto;
  background-color: #fff;
  box-shadow: 0 0 10px #ccc;
  padding: 20px;
  text-align: left;
  border-radius: 8px;
  font-family: Arial, sans-serif;
}

.card-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}

.card-price {
  font-size: 18px;
  color: green;
  margin-bottom: 15px;
}

.card-features {
  list-style: none;
  padding-left: 0;
  margin-bottom: 15px;
}

.card-features li {
  padding: 6px;
  border-bottom: 1px solid #eee;
}

.card-btn {
  background: blue;
  color: white;
  padding: 10px 20px;
  border: none;
  margin-top: 10px;
  cursor: pointer;
  border-radius: 4px;
}

.card-btn:hover {
  background: darkblue;
}
</style>
</head>
<body>

<!-- Réutilisable : Card(title, price, features) -->
<div class="card">
  <h2 class="card-title">Basic Plan</h2>
  <p class="card-price">$9.99 /month</p>

  <ul class="card-features">
    <li>1 GB Storage</li>
    <li>Basic Support</li>
    <li>All Core Features</li>
  </ul>

  <button class="card-btn" onclick="alert('Trial started!')">Start Trial</button>
</div>

</body>
</html>
